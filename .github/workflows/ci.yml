name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            appstream build-essential desktop-file-utils libglib2.0-dev \
            libgtk-3-dev libxapp-dev meson ninja-build pkg-config
      - name: Configure
        run: meson setup build --prefix=/usr -Db_sanitize=address,undefined
      - name: Compile
        run: meson compile -C build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: meson test -C build --print-errorlogs
      - name: Validate desktop integration
        run: |
          desktop-file-validate build/data/io.axionis.ThemeManager.desktop
          appstreamcli validate --no-net data/io.axionis.ThemeManager.metainfo.xml
      - name: Test staged install
        run: meson install -C build --destdir "$PWD/stage"

  debian-package:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts libglib2.0-dev libgtk-3-dev \
            libxapp-dev meson ninja-build pkg-config
      - name: Build Debian package
        run: dpkg-buildpackage --no-sign --build=binary
      - name: Collect Debian packages
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: axionis-theme-manager-debian
          path: artifacts/*.deb
          if-no-files-found: error
